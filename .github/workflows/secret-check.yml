name: env-demo
on: push
      # workflow level: every job sees it
jobs:
  build:
    runs-on: ubuntu-latest
   # job level: every step in this job
    steps:
      - name: Test env set
        run: |
          if [ -n "$APP_TOKEN" ]; then
           echo "token is available to this step"
          fi
        env: 
          APP_TOKEN: ${{ secrets.APP_TOKEN }}

